<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- White circular background -->
  <circle cx="50" cy="50" r="45" fill="white" stroke="none"/>
  
  <!-- Envelope body (diamond/rhombus shape) -->
  <path d="M25 45 L50 70 L75 45 L50 20 Z" 
        fill="none" 
        stroke="#1a1a1a" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Envelope flap (top arc) -->
  <path d="M25 45 Q50 25 75 45" 
        fill="none" 
        stroke="#1a1a1a" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Cross lines on envelope -->
  <line x1="25" y1="45" x2="50" y2="58" 
        stroke="#1a1a1a" 
        stroke-width="4" 
        stroke-linecap="round"/>
  <line x1="75" y1="45" x2="50" y2="58" 
        stroke="#1a1a1a" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Magnifying glass circle -->
  <circle cx="62" cy="38" r="12" 
          fill="white" 
          stroke="#1a1a1a" 
          stroke-width="4"/>
  
  <!-- Magnifying glass glare -->
  <path d="M56 34 Q58 30 62 32" 
        fill="none" 
        stroke="#1a1a1a" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
  
  <!-- Magnifying glass handle -->
  <line x1="71" y1="47" x2="82" y2="58" 
        stroke="#1a1a1a" 
        stroke-width="4" 
        stroke-linecap="round"/>
</svg>
